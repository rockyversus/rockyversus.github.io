<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e151d">
  <meta name="robots" content="noindex">
  <title>Заколдованное место — Николай Гоголь</title>
  <style>
:root {
  color-scheme: dark;
  --background: #0e151d;
  --warm: #211811;
  --ink: #211810;
  --paper: #f6e4c9;
  --night-copy: #dce7ee;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--background); }
body { margin: 0; color: var(--paper); }

.reader {
  max-width: 35rem;
  margin-inline: auto;
}

.masthead {
  padding: 1.15rem clamp(1rem, 5vw, 2.25rem) 1.1rem;
  background: var(--warm);
}

.author {
  margin: 0 0 .35rem;
  color: #dfb685;
  font-size: .875rem;
  letter-spacing: .045em;
}

h1 {
  margin: 0;
  max-width: 17ch;
  color: #ffecd3;
  font: 700 clamp(1.85rem, 8.2vw, 3.05rem)/1.01 Georgia, "Times New Roman", serif;
  letter-spacing: -.035em;
  overflow-wrap: anywhere;
}

.garden { background: var(--warm); }
.field { background: var(--background); }
.panels { display: flow-root; }

.panel {
  position: relative;
  margin: 0 0 clamp(1.25rem, 5vw, 2.25rem);
}

.panel > img {
  display: block;
  width: 100%;
  height: auto;
  background: #111923;
}

.garden .panel > img { background: #37271c; }
.panel.quick { margin-bottom: .7rem; }
.panel.stumble { margin-bottom: .35rem; }
.panel.stop {
  width: 88%;
  margin: .65rem auto .8rem;
}

.line {
  position: relative;
  margin: .65rem 1rem 0;
  width: fit-content;
  max-width: calc(100% - 2rem);
  font-size: clamp(1.125rem, 4.2vw, 1.28rem);
  font-weight: 650;
  line-height: 1.3;
}

.line.speech {
  margin-top: -.9rem;
  padding: .5rem .85rem .55rem;
  border: 2px solid var(--ink);
  border-radius: .95rem .95rem .95rem .26rem;
  background: var(--paper);
  color: var(--ink);
}

.line.narration {
  margin-top: .9rem;
  padding-inline-start: .7rem;
  border-inline-start: 2px solid #dd9b5a;
  font-weight: 520;
  line-height: 1.42;
  max-width: min(42ch, calc(100% - 2rem));
}

.field .line.narration {
  border-color: #91a9ba;
  color: var(--night-copy);
}

.turn { margin-bottom: 0; }
.sound-cue {
  display: flex;
  align-items: center;
  min-height: clamp(4rem, 11vh, 6.5rem);
  margin: 0;
  padding-inline: clamp(1.2rem, 8vw, 2.75rem);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(1.45rem, 5.7vw, 1.95rem);
  font-style: italic;
  color: #e5bb97;
}

.scene-cut {
  height: clamp(4rem, 16vh, 9rem);
  height: clamp(4rem, 16svh, 9rem);
  background: linear-gradient(var(--warm), var(--background) 72%);
}

.field .panel { margin-bottom: clamp(1.8rem, 8vw, 3rem); }
.field .landmarks { margin-bottom: clamp(2rem, 9vh, 5rem); }
.field .flame { margin-bottom: clamp(2.8rem, 16vh, 10rem); }
.field .ending { margin-bottom: 0; }
.ending .line.speech {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(1.7rem, 7vw, 2.4rem);
}

.credits {
  margin: 2.8rem 1rem 0;
  padding: 1.5rem 0 2.8rem;
  border-top: 1px solid #435360;
}

.credits p {
  margin: 0 0 .7rem;
  color: #b0bdc8;
  font-size: .95rem;
  line-height: 1.5;
}

.credits a {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  color: #f0d2a9;
  text-underline-offset: .2em;
}

.credits a:focus-visible { outline: 2px solid #f0d2a9; outline-offset: 3px; }

.feedback { margin-top: 1.5rem; }

.feedback h2 {
  margin: 0 0 .45rem;
  font-size: 1.125rem;
}

.feedback-links {
  display: flex;
  flex-wrap: wrap;
  column-gap: 1.25rem;
}

@media (min-width: 38rem) {
  .reader { box-shadow: 0 0 4rem #0008; }
  .masthead { padding-top: 1.65rem; padding-bottom: 1.55rem; }
}

@media print {
  .scene-cut { height: 2rem; }
  .panel { break-inside: avoid; }
}

.storyboard {
  --background: #161526;
  --warm: #2b1f30;
  --paper: #f4e0ce;
  --ink: #201a2b;
  --night-copy: #eee6f4;
  background: var(--background);
}

.drawing-library {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}

.storyboard .masthead {
  padding-block: .75rem;
}

.storyboard .author { color: #e2aaa2; }

.storyboard .masthead h1 {
  max-width: none;
  font-size: clamp(1.4rem, 6vw, 2.45rem);
}

.storyboard .panel > svg {
  display: block;
  width: 100%;
  height: auto;
}

.storyboard .panel-number {
  position: absolute;
  inset: .55rem .55rem auto auto;
  z-index: 1;
  padding: .25rem .45rem;
  border: 1px solid #efcfbb8c;
  border-radius: .3rem;
  background: #241b2c;
  color: #f8e4d8;
  font: 650 .75rem/1.2 system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

.storyboard .field .panel.quick { margin-bottom: 1.2rem; }
.storyboard .panel.pause { margin-bottom: clamp(2rem, 10svh, 5.5rem); }
.storyboard .panel.turn { margin-bottom: .45rem; }
.storyboard .panel.wide { margin-bottom: 1.6rem; }
.storyboard .panel.ending { margin-bottom: 0; }
.storyboard .panel:last-child:not(.turn) { padding-bottom: .65rem; }
.storyboard .line.speech { margin-top: .55rem; }
.storyboard figcaption .line + .line { margin-top: .55rem; }

.storyboard .opening { margin-bottom: 1.45rem; }

.storyboard .opening > svg {
  max-height: min(58svh, 23rem);
  background: #211b29;
}

.storyboard .opening .line.speech {
  margin: -.85rem auto 0;
  width: calc(100% - 2rem);
  padding: .65rem .85rem .75rem;
  font-size: clamp(1.16rem, 4.9vw, 1.42rem);
  line-height: 1.35;
}

.storyboard .speaker {
  display: block;
  margin-bottom: .15rem;
  font-size: .72em;
  font-weight: 750;
  color: #6d4556;
}

.alpha-label {
  color: #e2b5ae;
  font-size: .75rem;
  margin: .35rem 0 .1rem;
}

.panel-art {
  position: relative;
}

.panel-art img {
  display: block;
  width: 100%;
  height: auto;
}

.opening .panel-art {
  background: #211b29;
}

.opening .panel-art img {
  max-height: min(55svh, 23rem);
  object-fit: contain;
}

.candle-effect {
  position: absolute;
  display: block;
  transform: translate(-50%, -100%);
  pointer-events: none;
}

.candle-effect.flame {
  width: .34rem;
  height: .62rem;
  border-radius: 70% 25% 62% 60%;
  background: #fff0ab;
  box-shadow: 0 0 .32rem .13rem #ffa954, 0 0 .8rem .26rem #ee7f4369;
}

.candle-effect.far {
  width: .22rem;
  height: .42rem;
}

.candle-effect.smoke {
  width: .52rem;
  height: .76rem;
  border-left: 1px solid #d8d2dbad;
  border-radius: 70% 0 0 0;
}

.storyboard .sound-cue {
  min-height: 3.1rem;
  padding-block: .45rem;
}

.storyboard .time-place {
  margin: 1.35rem 1rem .55rem;
  color: var(--paper);
  font-size: 1.0625rem;
  font-weight: 650;
  line-height: 1.3;
}

.story-cut { height: clamp(1.7rem, 6svh, 3.5rem); }
.story-cut.garden-to-garden { background: var(--warm); }
.story-cut.garden-to-field { background: linear-gradient(var(--warm), var(--background)); }
.story-cut.field-to-garden { background: linear-gradient(var(--background), var(--warm)); }
.story-cut.reveal { height: clamp(.25rem, 2svh, 1.2rem); }
.story-cut.silence {
  height: clamp(2.6rem, 9svh, 4.5rem);
  background: #110f1b;
}
.story-cut.impact {
  height: .25rem;
  background: var(--background);
}

@media print {
  .storyboard .panel.pause { margin-bottom: 1rem; }
}


</style>
</head>
<body class="storyboard">
  <main class="reader">
    <header class="masthead">
      <p class="author">Николай Гоголь</p>
      <h1>Заколдованное место</h1>
    </header>
    
<section class="panels garden" aria-label="Быль Фомы">
<figure class="panel opening"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-01.webp" width="620" height="373" alt="Кочерга шевелит угли в тёмном проёме печи. Два уголька светятся так, что похожи на глядящие из темноты глаза." fetchpriority="high"></div><figcaption><p class="line speech"><strong class="speaker">Фома</strong> Говорите, нечистую силу можно перехитрить? Захочет она вас обмануть — обманет.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-02.webp" width="620" height="373" alt="Фома бежит посередине, ближе всех к зрителю. Вместе с двумя братьями он сгоняет птиц с баштана, где растут дыни и арбузы." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Тот, что бежит посередине, — это я, Фома. Отец уехал в Крым продавать табак, а дед Максим взял нас с братьями сторожить баштан. Там росли дыни и арбузы. Мы гоняли птиц, а сами объедались до икоты.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-03.webp" width="620" height="413" alt="По извилистой дороге тянутся возы с волами. У ближайшей упряжки машет рукой усатый чумак." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Под вечер по дороге потянулись возы с волами. Это чумаки, торговцы. Дед присмотрелся — да он их всех знает!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-04.webp" width="620" height="609" alt="Максим крепко жмёт руку знакомому усатому чумаку." loading="lazy" decoding="async"></div><figcaption><p class="line speech"><strong class="speaker">Чумак</strong> Здорово, Максим!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-05.webp" width="620" height="401" alt="Фома пляшет под сопилку Остапа. У сидящего Максима нетерпеливо дёргается каблук." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Дед велел нам сплясать перед гостями. Остап заиграл на сопилке, деревянной дудочке. Гляжу, у деда ноги сами дёргаются.</p></figcaption></figure>
</section>
<div class="story-cut garden-to-garden" aria-hidden="true"></div>
<section class="panels garden" aria-label="Пляска у огуречной грядки">
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-06.webp" width="620" height="411" alt="Максим встаёт перед чумаками, разводит руки и стучит каблуками. Оба сапога ещё на земле." loading="lazy" decoding="async"></div><figcaption><p class="line speech"><strong class="speaker">Дед</strong> Вот как танцуют!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-07.webp" width="620" height="372" alt="Максим высоко вскидывает сапог. Чумак поднимает руку, Фома и Остап следят за пляской." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Гляжу, не вытерпел старик. И как пошёл плясать! Только пятки засверкали.</p></figcaption></figure>
<figure class="panel stumble"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-08.webp" width="620" height="372" alt="У светлого камешка возле грядки сапог замер, а корпус деда по инерции летит вперёд." loading="lazy" decoding="async"></div><figcaption><p class="line narration">У огуречной грядки дед хотел вскинуть ногу. Дёрнул — а сапог не отрывается от земли.</p></figcaption></figure>
<figure class="panel stop"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-09.webp" width="620" height="374" alt="Два неподвижных сапога стоят по обе стороны светлого камешка." loading="lazy" decoding="async"></div></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-10.webp" width="620" height="612" alt="Максим разбегается по двору к светлому камешку возле огуречной грядки." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Ну как тут опозориться перед гостями? Дед отошёл к краю площадки и взял разбег.</p></figcaption></figure>
<figure class="panel stop"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-11.webp" width="620" height="413" alt="Те же сапоги снова застыли у того же камешка." loading="lazy" decoding="async"></div><figcaption><p class="line narration">С разбега — и снова встал как вкопанный. У того же камешка.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-12.webp" width="620" height="401" alt="Дед переступает мелкими шагами. Локти прижаты, взгляд устремлён на грядку." loading="lazy" decoding="async"></div><figcaption><p class="line narration">В третий раз пошёл мелкими шажками. Мы уже думали, что теперь-то у него выйдет…</p></figcaption></figure>
<figure class="panel stop"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-09.webp" width="620" height="374" alt="Ноги в третий раз замирают возле светлого камешка." loading="lazy" decoding="async"></div><figcaption><p class="line speech"><strong class="speaker">Дед</strong> Ах ты, чёрт! Чтоб ты гнилой дыней подавился!</p></figcaption></figure>
<p class="sound-cue">Ха… ха-ха!</p><figure class="panel turn"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-14.webp" width="620" height="413" alt="Услышав смех за спиной, Максим резко оборачивается через плечо." loading="lazy" decoding="async"></div></figure>
</section>
<div class="story-cut reveal silence garden-to-field" aria-hidden="true"></div>
<section class="panels field" aria-label="Огонёк на могиле">
<figure class="panel wide"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-15.webp" width="620" height="620" alt="Баштан, возы и люди исчезли. Максим стоит один посреди ночного поля." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Дальше — со слов деда. Обернулся он — и смех как отрезало. Ни баштана, ни чумаков. Кругом поле. И ни души.</p></figcaption></figure>
<figure class="panel landmarks"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-16.webp" width="620" height="373" alt="Слева голубятня на шесте, справа широкая крыша гумна. Между ними вьётся тропинка." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Место вроде знакомое. Слева голубятня священника. Справа гумно — сарай, где из колосьев выбивают зерно. Как дед сюда попал?</p></figcaption></figure>
<figure class="panel flame"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-18.webp" width="620" height="373" alt="У тропы на ближней могилке вспыхивает одна свечка." loading="lazy" decoding="async"><span class="candle-effect flame" style="left:29.35%;top:57.5%" aria-hidden="true"></span></div><figcaption><p class="line narration">Вышел на тропинку и увидел свечку на могилке. Кто её посреди ночи зажёг?</p></figcaption></figure>
<figure class="panel flame pause"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-18.webp" width="620" height="373" alt="Та же могилка. Огонь погас, над фитилём осталась струйка дыма." loading="lazy" decoding="async"><span class="candle-effect smoke" style="left:29.35%;top:57.5%" aria-hidden="true"></span></div></figure>
<figure class="panel flame pause"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-18.webp" width="620" height="373" alt="Ближняя могилка тёмная. Вторая свечка загорается дальше и правее." loading="lazy" decoding="async"><span class="candle-effect flame far" style="left:76.25%;top:46.15%" aria-hidden="true"></span></div><figcaption><p class="line narration">Тут бы, кажется, домой повернуть. А деду, знаете, совсем другое в голову пришло.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-20.webp" width="620" height="611" alt="Максим замечает огонёк. У него расширяются глаза." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Дед решил, что вторая свечка отмечает место, где зарыто золото.</p><p class="line speech"><strong class="speaker">Дед</strong> Клад!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-21.webp" width="620" height="413" alt="Максим кладёт длинную раздвоенную ветку на дальнюю могилку, рядом со свечкой." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Копать-то нечем. Дед пометил могилу раздвоенной веткой, чтобы потом её найти.</p></figcaption></figure><figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-21a.webp" width="620" height="337" alt="Поздней ночью Максим возвращается к шалашу на баштане. Среди арбузов виден освещённый вход в шалаш." loading="lazy" decoding="async"></div></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-21b.webp" width="620" height="337" alt="В шалаше дед накинул овчинную шубу и тронул Остапа за плечо. Мальчик открывает глаза при свете лампы." loading="lazy" decoding="async"></div></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-22.webp" width="620" height="401" alt="В шалаше дед Максим сидит на подстилке и держит края овчинной шубы у груди. Остап присел рядом и спрашивает, где он был." loading="lazy" decoding="async"></div><figcaption><p class="line narration">«Куда ты пропал?» — спросил Остап шёпотом.</p><p class="line speech"><strong class="speaker">Дед</strong> Не спрашивай, Остап. А то поседеешь!</p></figcaption></figure>
</section>
<div class="story-cut field-to-field" aria-hidden="true"></div>
<section class="panels field" aria-label="Дорога обманывает">
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-23.webp" width="548" height="425" alt="На следующем закате Максим идёт вдоль плетня. Несёт узкий заступ и широкую лопату на длинных черенках." loading="lazy" decoding="async"></div><figcaption><p class="line narration">На следующий вечер дед взял две разные лопаты, узкую и широкую, и пошёл к огороду священника. Дорогу-то он помнил.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-24.webp" width="620" height="375" alt="В прежнем поле видна только голубятня слева. Справа на месте гумна пустой горизонт." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Голубятня на месте, а гумна нет! Свернул к гумну…</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-25.webp" width="620" height="389" alt="Тот же горизонт. Гумно справа вернулось, а голубятни слева больше нет." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Гумно нашлось, голубятня пропала. И так, куда ни поверни. Вместе их никак не увидеть.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-26.webp" width="620" height="404" alt="Дед бежит под ливнем босиком, в одной руке держит свёрток с сапогами, в другой — обе лопаты. Два разных лезвия видны за его спиной." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Хлынул ливень, и дед бросил поиски. Снял сапоги, чтоб не испортить, и босиком добежал до нашего шалаша. Сам вымок до нитки, зато сапоги сухие.</p></figcaption></figure>
</section>
<div class="story-cut field-to-garden" aria-hidden="true"></div>
<section class="panels garden" aria-label="То самое место">
<p class="time-place">Наутро. У того же шалаша.</p><figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-27.webp" width="620" height="614" alt="Днём Максим накрывает арбуз широким листом. Мальчики держат дыню, изогнутую как змея." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Дед как ни в чём не бывало накрывал арбузы листьями. А нам дал турецкую дыню из семян, которые привезли издалека. Свернулась, как змея.</p></figcaption></figure>
<figure class="panel turn"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-28.webp" width="601" height="426" alt="Дед подался вперёд и бьёт лопатой в землю рядом со светлым камешком. Обе руки на длинном черенке." loading="lazy" decoding="async"></div><figcaption><p class="line narration">К вечеру дед взялся за новую грядку под тыквы. Увидел тот самый камешек, где у него ноги застряли. «Проклятое место!» — буркнул дед и ударил лопатой в землю.</p></figcaption></figure>
</section>
<div class="story-cut reveal impact garden-to-field" aria-hidden="true"></div>
<section class="panels field" aria-label="Что откопал дед">
<figure class="panel wide"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-29.webp" width="600" height="427" alt="После удара Максим снова в ночном поле. Слева голубятня, справа гумно. У дальней свечки лежит раздвоенная ветка." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Ударил — и вместо грядки опять ночное поле. Теперь видны и голубятня, и гумно.</p></figcaption></figure><figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-29a.webp" width="620" height="245" alt="Максим идёт по тропинке к могиле. На бугре горит свечка, рядом лежит знакомая раздвоенная ветка, за ними виден камень." loading="lazy" decoding="async"></div></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-29b.webp" width="620" height="218" alt="Крупно видна та же ветка. От свечного фитиля поднимается дым. Дед вводит лопату в землю под краем большого камня." loading="lazy" decoding="async"></div></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-30.webp" width="601" height="427" alt="У могилы погасла свечка. Максим отталкивает большой камень, и тот катится вправо. На его месте открывается земля." loading="lazy" decoding="async"></div><figcaption><p class="line speech"><strong class="speaker">Дед</strong> Туда тебе и дорога!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-31.webp" width="619" height="410" alt="Максим держит в одной руке рожок, а другой подносит к носу щепотку табака. Сверху на лицо летят брызги от чиха." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Дед достал нюхательный табак. Только поднёс щепотку к носу, как кто-то чихнул у него прямо над головой.</p><p class="line speech"><strong class="speaker">Дед</strong> Отвернулся бы, раз чихаешь!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-32.webp" width="620" height="447" alt="Лопата звякает по крышке чугунного котла. Из земли показались два ушка." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Лопата звякнула о крышку котла. Дед отгрёб землю. В нём-то и золото, решил он.</p><p class="line speech"><strong class="speaker">Дед</strong> Ага, вот ты где!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-33.webp" width="620" height="445" alt="Птичий клюв стучит по крышке котла. Баранья голова свисает с дерева, из-за ствола выглядывает медвежье рыло." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Тут птичий клюв пискнул то же самое. Следом проблеяла баранья голова, а из-за дерева те же слова проревел медведь.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-34.webp" width="619" height="411" alt="Клюв, баран и медведь обступают деда. Максим прижал ладонь ко рту." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Дед только «гм». Клюв пискнул «гм», баран проблеял «гм», а медведь как рявкнет!</p></figcaption></figure><p class="sound-cue">Гум!</p>
<figure class="panel pause"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-35.webp" width="620" height="308" alt="Максим маленькой фигурой стоит у края пропасти. На противоположной скале проступает красноглазая харя и высовывает язык." loading="lazy" decoding="async"></div><figcaption><p class="line speech"><strong class="speaker">Дед</strong> Чёрт с тобой! Забирай свой клад!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-36.webp" width="620" height="448" alt="Обрыв исчез. Максим обеими руками вытягивает из ямы тяжёлый закрытый котёл." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Уже бежать хотел. Оглянулся — вокруг опять ровная земля. «Только пугает», — решил дед. Упёрся, потянул и вытащил котёл.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-37.webp" width="620" height="447" alt="Максим прячет рожок с табаком. Рядом закрытый котёл, а в коре пня проступают глаза и ноздри." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Выкопав котёл, дед решил всё-таки понюхать табак. Тут пень раздул ноздри. «Сейчас и этот чихнёт!» Дед убрал табак.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-38.webp" width="620" height="446" alt="Максим бежит к знакомому плетню с закрытым котлом. Сзади по сапогам хлещут прутья." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Котёл в охапку — и бежать. Будто кто прутьями по обеим ногам хлещет! Только у знакомого плетня дед отдышался.</p></figcaption></figure>
</section>
<div class="story-cut field-to-garden" aria-hidden="true"></div>
<section class="panels garden" aria-label="Котёл и помои">
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-39.webp" width="620" height="436" alt="Из шалаша светит лампа. Фома и братья доедают галушки, мать поднимает горшок с помоями." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Мы с братьями уже часа три ждали деда. Мать принесла галушки — варёные кусочки теста. Поели без него. Мать вымыла горшок и искала, куда выплеснуть грязную воду.</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-40.webp" width="620" height="436" alt="Мать с горшком смотрит на круглую тень на тропинке. В темноте тень похожа на бочку." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Мать в полутьме увидела, будто по дорожке сама собой движется бочка. Решила, что кто-то из нас толкает её сзади. «Вот куда вылью!»</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-41.webp" width="620" height="439" alt="Мать наклоняет горшок, и струя горячей воды летит прямо на круглую тень. В воздухе летят капли и корки." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Мать плеснула помои прямо на «бочку». А та вдруг крикнула человеческим голосом.</p><p class="line speech">Ай!</p></figcaption></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-42.webp" width="620" height="439" alt="Под арбузной коркой видна седая голова Максима. Он держит закрытый котёл, с усов капает вода." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Тут мы и разглядели деда. С усов капает, на голове арбузная корка, а котёл он так и держит.</p><p class="line speech"><strong class="speaker">Дед</strong> Ну, ребята, теперь вам денег на бублики хватит!</p></figcaption></figure>
<figure class="panel pause"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-43.webp" width="620" height="446" alt="Максим приподнимает крышку котла. Трое мальчишек с любопытством наклоняются, содержимого пока не видно." loading="lazy" decoding="async"></div></figure>
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-44.webp" width="620" height="446" alt="Вид сверху в раскрытый котёл. Внутри ворох грязных очисток, корок и стеблей. Крышка сдвинута в сторону." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Ну что, золото? Мусор да гниль. Дед плюнул, бросил котёл и руки вымыл.</p></figcaption></figure>
</section>
<div class="story-cut garden-to-garden" aria-hidden="true"></div>
<section class="panels garden" aria-label="Что осталось на баштане">
<figure class="panel quick"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-45.webp" width="620" height="403" alt="Плетень теперь окружает светлый камешек у огуречной грядки. Максим крестится. Мальчики сносят туда сор и бурьян." loading="lazy" decoding="async"></div><figcaption><p class="line narration">С тех пор дед твердил, что нечистой силе верить нельзя. То место велел отгородить, чтобы сбрасывать туда сорняки и мусор.</p></figcaption></figure>
<figure class="panel ending"><div class="panel-art"><img src="assets/gogol-beta-27c2a67572474b29-46.webp" width="620" height="308" alt="У плетня растёт полосатый плод с круглым боком и длинной изогнутой шеей. Позади видны обычные арбузы." loading="lazy" decoding="async"></div><figcaption><p class="line narration">Потом отец сдал баштан соседним казакам. Они засеяли и тот клочок. Везде урожай отличный, а там — арбуз не арбуз, тыква не тыква. Чёрт знает, что такое!</p></figcaption></figure>
</section>
